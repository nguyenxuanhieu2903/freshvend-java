spring:
  application:
    name: vending-machine
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/vending_machine}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health
